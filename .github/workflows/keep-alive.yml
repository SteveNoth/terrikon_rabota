# Keep-alive для бесплатного Supabase (Этап 24).
# Раз в 3 дня дергаем /api/health, чтобы проект не уснул от простоя.
# Секрет не нужен: health публичный, персональные данные не отдаёт.

name: keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Ping /api/health
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: bash scripts/ci/keep-alive.sh
