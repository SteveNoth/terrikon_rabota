# Пересчёт vacancyCount у сфер и городов раз в час (Этап 25).
# Страницы читают готовые числа, не считают Vacancy на каждом заходе.

name: hygiene-counts

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

jobs:
  counts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Recompute counts
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/ci/recompute-counts.sh
