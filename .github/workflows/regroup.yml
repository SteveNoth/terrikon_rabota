# Ночная нечёткая группировка дублей (раздел 11.17).
# Не в /api/parser/upload: у Vercel 10 секунд.

name: regroup-duplicates

on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

jobs:
  regroup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Regroup
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/regroup.py
