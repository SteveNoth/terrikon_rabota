# Парсер открытых данных «Работы России» / ЦЗН (Этап 18A). Класс OPEN_DATA.
#
# Cron раз в сутки в 06:00 UTC — после сайтов (05:00). Не каждые три часа:
# официальная база не меняется так часто, как стены соцсетей.
#
# Распознавание картинок НЕ ставим: в JSON нет фотографий поста.
# Браузер НЕ ставим: это GET JSON, не HTML и не одностраничное приложение.
# На приватном репозитории лимит 2000 мин/мес. Оценка при ~7951 записи
# региона, limit=100 (~80 страниц), пауза 1–3 с: 3–6 мин сеть + обработка
# ≈ 5–10 мин/запуск × 30 ≈ 150–300 мин/месяц. Это дешевле соцсетей с OCR.

name: parser-trudvsem

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OCR_PROVIDER: none
      SOURCE_TRUDVSEM_ENABLED: "true"
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Работа России parser
        run: python scripts/parser_trudvsem.py

      - name: Notify Telegram subscribers
        if: success()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: bash scripts/ci/telegram-notify.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-trudvsem-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          if [ -f logs/summary.md ]; then
            cat logs/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Нет logs/summary.md — парсер не успел написать отчёт." >> "$GITHUB_STEP_SUMMARY"
          fi
